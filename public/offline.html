<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#22150f">
<title>Sem internet · Vie Company</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #22150f; color: #f1e6b2; font: 16px/1.55 'BW Modelica', 'Outfit', system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 340px; display: grid; gap: 18px; justify-items: center; }
  img { width: 150px; }
  h1 { font: 400 30px/1.1 'Black Mango', 'Bodoni Moda', Georgia, serif; margin: 8px 0 0; color: #fff; }
  p { margin: 0; opacity: .8; }
  button { margin-top: 6px; background: #8a391b; color: #fff; border: 0; border-radius: 999px; padding: 12px 26px; font: inherit; font-weight: 500; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/img/logo-creme.png" alt="Vie Company">
  <h1>Você está sem internet</h1>
  <p>O portal precisa de conexão para mostrar os seus cronogramas e entregas. Assim que a internet voltar, é só tentar de novo.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
